name: Sync firmware catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test catalog generator
        run: npm run catalog:test

      - name: Synchronize stable releases
        run: npm run catalog:sync
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build application
        run: ./node_modules/.bin/ng build

      - name: Commit catalog changes
        run: |
          if git diff --quiet -- src/assets/apps.json src/assets/generated; then
            echo "Catalog is already up to date; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/apps.json src/assets/generated
          git commit -m "chore: update firmware catalog"
          git push origin "HEAD:${GITHUB_REF_NAME}"
