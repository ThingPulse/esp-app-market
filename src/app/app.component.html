<div class="app-shell">
  <header class="site-header">
    <a class="brand" routerLink="/" aria-label="ESP App Market home">
      <span class="brand-mark"><mat-icon>memory</mat-icon></span>
      <span>
        <strong>ESP App Market</strong>
        <small>Firmware, ready to flash</small>
      </span>
    </a>

    <nav class="header-actions" aria-label="Main navigation">
      <a mat-button routerLink="/"><mat-icon>grid_view</mat-icon> Devices</a>
      <a mat-button routerLink="/diagnostics"><mat-icon>troubleshoot</mat-icon> Diagnostics</a>
      <button mat-icon-button class="theme-toggle" (click)="toggleTheme()"
              [attr.aria-label]="theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
              [matTooltip]="theme === 'dark' ? 'Light mode' : 'Dark mode'">
        <mat-icon>{{theme === 'dark' ? 'light_mode' : 'dark_mode'}}</mat-icon>
      </button>
      <a mat-stroked-button href="https://github.com/ThingPulse/" target="_blank" rel="noopener">
        <mat-icon>code</mat-icon> GitHub
      </a>
    </nav>
  </header>

  <main class="page-container">
    <router-outlet></router-outlet>
  </main>

  <footer class="site-footer">
    <div class="footer-brand"><mat-icon>memory</mat-icon> ESP App Market</div>
    <span>Open firmware tools by <a href="https://www.thingpulse.com" target="_blank" rel="noopener">ThingPulse</a></span>
    <span class="build-info" [matTooltip]="environment?.buildDate || ''">v1.0.1 · {{getCurrentYear()}}</span>
  </footer>
</div>
